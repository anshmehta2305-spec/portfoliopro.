<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5FD6" />
      <stop offset="100%" stop-color="#1BB5D0" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#C5A46D" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Emblem Shield / Backing -->
  <rect x="6" y="6" width="88" height="88" rx="18" fill="#0B1F3A" stroke="#B08D57" stroke-width="2" />
  
  <!-- Stylized Monogram 'P' with Rising Financial Bars -->
  <!-- Left Stem of P -->
  <path d="M 28 24 L 28 76" stroke="url(#pGrad)" stroke-width="10" stroke-linecap="round" />
  
  <!-- Upper Loop of P -->
  <path d="M 28 24 C 54 24, 66 32, 66 45 C 66 58, 54 66, 28 66" stroke="url(#pGrad)" stroke-width="9" stroke-linecap="round" fill="none" />
  
  <!-- Ascending Growth Bars inside / alongside the curve -->
  <rect x="40" y="44" width="5" height="14" rx="2" fill="url(#pGrad)" />
  <rect x="49" y="36" width="5" height="22" rx="2" fill="url(#pGrad)" />
  <rect x="58" y="28" width="5" height="30" rx="2" fill="url(#goldAcc)" />
  
  <!-- Sparkle / Star at peak -->
  <polygon points="60.5,21 62,24 65,24.5 62.5,27 63,30 60.5,28 58,30 58.5,27 56,24.5 59,24" fill="#B08D57" />
</svg>

