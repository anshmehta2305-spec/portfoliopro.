<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="pStemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="pLoopGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="goldBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B08D57" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Emblem Shield / Backing in Institutional Navy with Gold Border -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#0A1628" stroke="#C5A46D" stroke-width="2.5" />
  
  <!-- Stylized Monogram 'P' (Unmistakable P with Open Lower Half) -->
  <g filter="url(#glow)">
    <!-- Main Vertical Stem of P: extends from top (y=18) all the way down to y=82 -->
    <path d="M 27 18 L 27 82" stroke="url(#pStemGrad)" stroke-width="11" stroke-linecap="round" />
    
    <!-- Upper Loop of P: starts at (27, 18), sweeps right and returns to stem at (27, 49) -->
    <!-- Notice: loop finishes at y=49, leaving y=49 to y=82 completely open so it is 100% a 'P' -->
    <path d="M 27 18 H 53 C 68 18, 72 26, 72 33.5 C 72 41, 68 49, 53 49 H 27" 
          stroke="url(#pLoopGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- 3 Rising Financial Growth Bars inside the P's loop & core -->
    <!-- Bar 1: Light Blue (short) -->
    <rect x="36" y="37" width="5.5" height="12" rx="2" fill="#38BDF8" />
    <!-- Bar 2: Vibrant Cyan (medium) -->
    <rect x="45.5" y="29" width="5.5" height="20" rx="2" fill="#06B6D4" />
    <!-- Bar 3: Ascending Gold (tallest) -->
    <rect x="55" y="21" width="5.5" height="28" rx="2" fill="url(#goldBarGrad)" />
    
    <!-- Gold Star / Sparkle of Financial Prosperity at peak -->
    <path d="M 57.75 12 L 59.5 15.5 L 63 16.5 L 60.5 19 L 61 22.5 L 57.75 20.5 L 54.5 22.5 L 55 19 L 52.5 16.5 L 56 15.5 Z" 
          fill="#FDE047" stroke="#B08D57" stroke-width="0.5" />
  </g>
</svg>
