<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="pGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5FD6" />
      <stop offset="100%" stop-color="#1BB5D0" />
    </linearGradient>
    <linearGradient id="goldAccLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#8C6E3D" />
    </linearGradient>
  </defs>

  <!-- P Emblem Shield -->
  <g transform="translate(6, 6) scale(0.52)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#0B1F3A" stroke="#B08D57" stroke-width="3" />
    <path d="M 30 24 L 30 76" stroke="url(#pGradLight)" stroke-width="11" stroke-linecap="round" />
    <path d="M 30 24 C 56 24, 68 32, 68 45 C 68 58, 56 66, 30 66" stroke="url(#pGradLight)" stroke-width="10" stroke-linecap="round" fill="none" />
    <rect x="42" y="44" width="5.5" height="14" rx="2" fill="url(#pGradLight)" />
    <rect x="52" y="36" width="5.5" height="22" rx="2" fill="url(#pGradLight)" />
    <rect x="62" y="28" width="5.5" height="30" rx="2" fill="url(#goldAccLight)" />
    <polygon points="65,20 66.5,23 69.5,23.5 67,26 67.5,29 65,27 62.5,29 63,26 60.5,23.5 63.5,23" fill="#B08D57" />
  </g>

  <!-- Text: "Portfolio" in Navy + "Pro" in Logo Blue -->
  <text x="68" y="42" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#0B1F3A" letter-spacing="0.5">Portfolio</text>
  <text x="194" y="42" font-family="'Source Sans 3', system-ui, sans-serif" font-size="29" font-weight="800" fill="#1F5FD6" letter-spacing="1">Pro</text>
  
  <circle cx="258" cy="36" r="2.5" fill="#B08D57" />
  <text x="69" y="56" font-family="'Source Sans 3', sans-serif" font-size="9" font-weight="600" fill="#8C6E3D" letter-spacing="2.2" text-transform="uppercase">Wealth Technology</text>
</svg>

